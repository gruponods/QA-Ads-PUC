<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans)}.c{padding:28px}</style>
</head>
<body><div class="c"><div style="display:flex;gap:18px;align-items:flex-end"><div style="text-align:center"><div style="width:98px;height:70px;background:var(--nods-blue-050);border:1px solid var(--nods-blue);border-radius:8px"></div><div style="margin-top:10px;font-size:12px;font-weight:500">--radius-sm</div><div style="font-size:11px;color:var(--gray-500)">8px</div></div><div style="text-align:center"><div style="width:98px;height:70px;background:var(--nods-blue-050);border:1px solid var(--nods-blue);border-radius:12px"></div><div style="margin-top:10px;font-size:12px;font-weight:500">--radius-card-sm</div><div style="font-size:11px;color:var(--gray-500)">12px</div></div><div style="text-align:center"><div style="width:98px;height:70px;background:var(--nods-blue-050);border:1px solid var(--nods-blue);border-radius:16px"></div><div style="margin-top:10px;font-size:12px;font-weight:500">--radius-card</div><div style="font-size:11px;color:var(--gray-500)">16px</div></div><div style="text-align:center"><div style="width:98px;height:70px;background:var(--nods-blue-050);border:1px solid var(--nods-blue);border-radius:24px"></div><div style="margin-top:10px;font-size:12px;font-weight:500">--radius-xl</div><div style="font-size:11px;color:var(--gray-500)">24px</div></div><div style="text-align:center"><div style="width:98px;height:70px;background:var(--nods-blue-050);border:1px solid var(--nods-blue);border-radius:999px"></div><div style="margin-top:10px;font-size:12px;font-weight:500">--radius-pill</div><div style="font-size:11px;color:var(--gray-500)">pill</div></div></div></div></body>
</html>
