<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;font-family:var(--font-sans);overflow:hidden}
  .main{flex:0 0 74%;background:var(--nods-blue);display:flex;align-items:center;justify-content:center;padding:0 96px}
  .main img{width:100%;max-width:620px;height:auto;display:block}
  .strip{flex:1;display:flex;flex-direction:column}
  .strip>div{flex:1}
</style>
</head>
<body>
  <div class="tile">
    <div class="main"><img src="assets/logo-nods-white.png" alt="NODS — Technology for Education"></div>
    <div class="strip">
      <div style="background:#C6902F"></div>
      <div style="background:#3E9B6B"></div>
      <div style="background:#C0544B"></div>
      <div style="background:#0B1B4D"></div>
    </div>
  </div>
</body>
</html>
