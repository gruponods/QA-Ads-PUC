<!doctype html>
<html lang="es">
<head>

<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans)}#root{padding:30px 34px}.grp{margin-bottom:28px}.grp:last-child{margin-bottom:0}.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);font-weight:500;margin:0 0 14px}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Avatar, ProgressBar, DataTable, StatusDot, CategoryChip, ThresholdValue, DataBar, HeatCell } = window.NodsDesignSystem_bde349;
function Demo() {

<ProgressBar value={58} size="sm" />
<ProgressBar value={100} size="sm" />

<CategoryChip tone={1} icon="math-function">Matemática</CategoryChip><CategoryChip tone={2} icon="book">Lengua</CategoryChip><CategoryChip tone={3} icon="flask">Ciencias</CategoryChip><CategoryChip tone={4}>Historia</CategoryChip><CategoryChip tone={5}>Inglés</CategoryChip><CategoryChip tone={6}>Arte</CategoryChip>
<CategoryChip tone={3} variant="outline">Outline</CategoryChip><CategoryChip tone={2} count={4} selected onClick={() => {}}>Filtro activo</CategoryChip><CategoryChip tone={4} count={2} selected={false} onClick={() => {}}>Inactivo</CategoryChip>

<div className="grp"><p className="lbl">Formato condicional</p><div className="row" style={{gap:'22px'}}>

<DataBar value={92} unit="%" warn={85} bad={75} width={80} /><DataBar value={71} unit="%" warn={85} bad={75} width={80} />

</div></div>);

</html>
