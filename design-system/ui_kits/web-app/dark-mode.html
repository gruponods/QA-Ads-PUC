<!-- @dsCard group="Web app" viewport="1380x1000" name="Dark mode — opciones" subtitle="NODS Aula en Claro, Grafito, Navy y Negro, lado a lado" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NODS Aula — Dark mode</title>
<link rel="stylesheet" href="../../styles.css">
<style>
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--font-sans)}
.page{padding:28px 32px 36px}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.bar h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;flex:1 1 auto}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--gray-100);border-radius:999px}
.seg button{border:1px solid transparent;background:transparent;font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--gray-500);padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;border-color:var(--gray-200);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:24px 20px}.cell{min-width:0}
.cell h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden}
.cell h2 span{font-size:12px;color:var(--gray-500);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.dot{width:14px;height:14px;border-radius:4px;border:1px solid var(--gray-200)}
.frame{width:100%;aspect-ratio:16/10;height:auto;border:1px solid var(--gray-200);border-radius:14px;overflow:hidden;position:relative}
.frame iframe{width:1440px;height:900px;border:0;transform:scale(.45);transform-origin:0 0;position:absolute;left:0;top:0}
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <h1>Opciones de dark mode</h1>
    <div class="seg" id="screens">
      <button type="button" data-s="tracking" aria-pressed="true">Seguimiento</button>
      <button type="button" data-s="home" aria-pressed="false">Inicio</button>
      <button type="button" data-s="reach" aria-pressed="false">Red regional</button>
      <button type="button" data-s="login" aria-pressed="false">Login</button>
    </div>
  </div>
  <div class="grid">
    <div class="cell"><h2><i class="dot" style="background:#FFFFFF"></i>Claro <span>Por defecto</span></h2><div class="frame"><iframe data-nods-theme="light" title="Claro"></iframe></div></div>
    <div class="cell"><h2><i class="dot" style="background:#15171B"></i>Grafito <span>Oscuro neutro · recomendado</span></h2><div class="frame"><iframe data-nods-theme="dark" title="Grafito"></iframe></div></div>
    <div class="cell"><h2><i class="dot" style="background:#0D1A40"></i>Navy <span>Azul profundo de la marca</span></h2><div class="frame"><iframe data-nods-theme="dark-navy" title="Navy"></iframe></div></div>
    <div class="cell"><h2><i class="dot" style="background:#000000"></i>Negro <span>Negro puro, solo líneas</span></h2><div class="frame"><iframe data-nods-theme="dark-black" title="Negro"></iframe></div></div>
  </div>
</div>
<script>
const frames = [...document.querySelectorAll('iframe')];
const fit = () => frames.forEach((f) => { f.style.transform = 'scale(' + (f.parentElement.clientWidth / 1440) + ')'; });
const ro = new ResizeObserver(fit);
frames.forEach((f) => ro.observe(f.parentElement));
fit();
const load = (s) => frames.forEach((f) => { f.src = `index.html?theme=${f.dataset.nodsTheme}&screen=${s}`; });
document.getElementById('screens').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#screens button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  load(b.dataset.s);
});
load('tracking');
</script>
</body>
</html>
